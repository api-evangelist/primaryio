name: PrimaryIO
description: 'PrimaryIO is a Silicon Valley cloud workload management and data mobility
  company based in Los Altos, California, that helps enterprises safely leverage the
  public cloud. Its portfolio includes ProtectIO, a Disaster-Recovery-as-a-Service
  offering; RecoverIO, a Ransomware-Recovery-as-a-Service offering; ConvertIO, which
  migrates VMware VMs into cloud-native virtual server instances; and a tech-enabled
  Migration-as-a-Service. The platform uses changed-block replication to cloud object
  storage with data encryption in transit and at rest for non-disruptive migrations
  and on-demand VMware infrastructure. PrimaryIO is backed by Accel and Partech. It
  currently publishes no public developer API.'
